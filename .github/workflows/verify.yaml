name: verify

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Through workflow_call `github` is the caller's: a release gets its own group (run_id), only PRs cancel.
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `pnpm verify` needs a PostgreSQL 16 cluster, so it runs in the repository's own
  # Docker harness (compose.verify.yaml): the pinned Node/pnpm image on the project's
  # `db` (compose.yaml), exactly as on a developer machine. No host runtime is used.
  verify:
    runs-on: ubuntu-24.04
    # The harness pushes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The project's `db` reads its password from .local/, which a fresh checkout lacks.
      - run: cp .env.example .env && scripts/init-secrets.sh
      - run: scripts/verify-docker.sh build
      - run: scripts/verify-docker.sh install
      - run: scripts/verify-docker.sh verify
      - if: always()
        run: scripts/verify-docker.sh down
